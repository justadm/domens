services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      POSTGRES_DSN: postgresql://domens:${POSTGRES_PASSWORD:-domens}@postgres:5432/domens
    ports:
      - "127.0.0.1:28080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket,sys; s=socket.create_connection((\"127.0.0.1\",8080),2); s.send(b\"GET /health HTTP/1.0\\r\\n\\r\\n\"); d=s.recv(64); s.close(); sys.exit(0 if b\"200\" in d else 1)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8080"
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: domens
      POSTGRES_USER: domens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-domens}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U domens -d domens"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  pg_data:
